name: Desktop release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            arch: arm64
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: windows-latest
            platform: win
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-release-version.cjs
      - run: npm test
      - name: macOS signing and notarization secrets
        if: runner.os == 'macOS'
        run: bash scripts/setup-macos-signing.sh
        env:
          CHORDZ_REQUIRE_SIGNING: ${{ startsWith(github.ref, 'refs/tags/') }}
          APPLE_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      - name: Package
        run: |
          if [[ "$RUNNER_OS" == macOS && -n "${CSC_NAME:-}" ]]; then
            npm run dist -- --${{ matrix.platform }} --${{ matrix.arch }} --config.forceCodeSigning=true
          else
            npm run dist -- --${{ matrix.platform }} --${{ matrix.arch }}
          fi
      - name: Verify macOS signature and notarization tickets
        if: runner.os == 'macOS' && env.APPLE_API_KEY != ''
        run: |
          for app in release/mac*/ChordZ.app; do
            test -d "$app"
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --type execute --verbose=2 "$app"
            xcrun stapler validate "$app"
          done
          for dmg in release/*.dmg; do
            test -f "$dmg"
            # electron-builder notarizes the app, not the outer disk image.
            # Submit the DMG separately before asking Apple for its ticket.
            xcrun notarytool submit "$dmg" \
              --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER" --wait --timeout 20m \
              --output-format json > "$RUNNER_TEMP/chordz-dmg-notarization.json"
            node -e 'const r = JSON.parse(require("fs").readFileSync(process.argv[1])); if (r.status !== "Accepted") throw new Error("DMG notarization " + r.status + ", submission " + r.id)' "$RUNNER_TEMP/chordz-dmg-notarization.json"
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ChordZ-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.exe
          if-no-files-found: error
          retention-days: 14
      - name: Clean up Apple credentials
        if: always() && runner.os == 'macOS'
        run: |
          if [ -f "$RUNNER_TEMP/chordz-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/chordz-signing.keychain-db"
          fi
          rm -f "$RUNNER_TEMP/chordz-developer-id.p12" "$RUNNER_TEMP/chordz-AuthKey.p8"
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ChordZ-*
          path: installers
          merge-multiple: true
      - name: Attach installers to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > release.json 2>/dev/null; then
            node -e 'if (!JSON.parse(require("fs").readFileSync("release.json")).isDraft) throw new Error("Refusing to overwrite a published release")'
            gh release upload "$RELEASE_TAG" installers/* --clobber
          else
            gh release create "$RELEASE_TAG" installers/* --verify-tag --draft --generate-notes --title "ChordZ $RELEASE_TAG"
          fi
